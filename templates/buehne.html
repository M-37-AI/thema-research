<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bühne · thema-research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Bühne – Raster der Agenten-Karten. Daten: /api/state (Snapshot) und /api/events (SSE).
   Tasten: F Vollbild · Klick auf Karte = groß/klein · ?standbild=1 zeigt nur den Snapshot. */
:root{
  --bg:#0b0f16; --flaeche:#131a24; --flaeche2:#0f151e; --linie:#243043; --text:#e6edf5; --leise:#8b9bb0; --faint:#5b6b80;
  --gruen:#22c55e; --rot:#ef4444; --ocker:#eab308; --blau:#4f8cff;
  --r-lead:#4f8cff; --r-markt:#2dd4bf; --r-treiber:#f59e0b; --r-kette:#a78bfa; --r-firma:#f472b6;
  --r-red-team:#ef4444; --r-lektor:#22c55e; --r-sonstige:#94a3b8;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
body{display:flex;flex-direction:column;padding:12px 16px;gap:10px;overflow:hidden}

/* Kopfzeile */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;min-height:52px}
.thema{display:flex;flex-direction:column;gap:2px;min-width:0}
.thema b{font-size:20px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thema span{color:var(--leise);font-family:var(--mono);font-size:12px}
.phasen{display:flex;gap:4px;align-items:center}
.phase{padding:4px 10px;border:1px solid var(--linie);border-radius:999px;color:var(--faint);font-size:12px;white-space:nowrap;transition:all .3s}
.phase.done{color:var(--leise);border-color:#2f3d52}
.phase.done::before{content:"✓ ";color:var(--gruen)}
.phase.aktiv{color:var(--text);background:#1b2636;border-color:var(--blau);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
.kennzahlen{display:flex;justify-content:flex-end;gap:18px}
.kz{display:flex;flex-direction:column;align-items:flex-end}
.kz b{font-family:var(--mono);font-size:18px;font-weight:600;line-height:1.1}
.kz span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.kz .ok{color:var(--gruen)} .kz .nein{color:var(--rot)}
.modus{padding:3px 8px;border-radius:6px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;background:#1b2636;color:var(--leise)}
.modus.live{color:#0b0f16;background:var(--gruen)} .modus.replay{color:#0b0f16;background:var(--ocker)}

/* Raster */
#raster{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));grid-auto-rows:minmax(0,1fr);gap:10px}
@media (max-width:1100px){#raster{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){#raster{grid-template-columns:1fr}}

/* Karte */
.karte{position:relative;display:flex;flex-direction:column;min-height:0;background:var(--flaeche);border:1px solid var(--linie);border-radius:12px;padding:10px 12px 8px;gap:6px;overflow:hidden;cursor:pointer;transition:border-color .25s,box-shadow .25s}
.karte.gross{grid-column:span 2;grid-row:span 2}
.karte.platzhalter{opacity:.45;cursor:default;border-style:dashed}
.karte.blitz-ok{border-color:var(--gruen);box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.karte.blitz-nein{border-color:var(--rot);box-shadow:0 0 0 3px rgba(239,68,68,.3)}
.kopf{display:flex;align-items:center;gap:8px;min-width:0}
.punkt{width:10px;height:10px;border-radius:50%;background:var(--r-sonstige);flex:none}
.name{font-weight:600;font-size:15px;white-space:nowrap}
.modell{font-family:var(--mono);font-size:11px;color:var(--leise);padding:1px 6px;border:1px solid var(--linie);border-radius:4px;white-space:nowrap}
.zustand{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--leise);font-size:12px;white-space:nowrap}
.ring{width:12px;height:12px;border-radius:50%;border:2px solid var(--faint);flex:none}
.z-denkt .ring,.z-schreibt .ring,.z-werkzeug .ring{border-color:var(--blau);border-top-color:transparent;animation:dreh 1s linear infinite}
.z-wartet_tuersteher .ring{border-color:var(--ocker);animation:puls 1s ease-in-out infinite}
.z-korrigiert .ring{border-color:var(--rot);animation:puls 1s ease-in-out infinite}
.z-bereit .ring{border-color:var(--gruen)}
.z-fertig .ring{border-color:var(--gruen);background:var(--gruen)}
.z-untaetig .ring{border-color:var(--faint);border-style:dashed}
@keyframes dreh{to{transform:rotate(360deg)}}
@keyframes puls{50%{opacity:.35}}
.aufgabe{color:var(--leise);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
.aufgabe b{color:var(--text);font-weight:500}
.aktuell{font-family:var(--mono);font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px;padding:3px 8px;background:var(--flaeche2);border-radius:6px}
.strom{flex:1;min-height:0;overflow-y:auto;mask-image:linear-gradient(to bottom,transparent 0,#000 14px);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px);font-family:var(--mono);font-size:11.5px;line-height:1.45;color:var(--leise);scrollbar-width:thin;scrollbar-color:var(--linie) transparent;display:flex;flex-direction:column;justify-content:flex-end}
.strom>div{padding:1px 0;white-space:pre-wrap;word-break:break-word;border-left:2px solid transparent;padding-left:6px}
.strom .s-text{color:var(--text)}
.strom .s-denkt{color:var(--faint);font-style:italic}
.strom .s-werkzeug{color:#9fc0ff;border-left-color:#2a4a80}
.strom .s-ergebnis{color:var(--faint)}
.strom .s-ergebnis.fehler{color:#f0a0a0}
.strom .s-nachricht{color:#e0c98a;border-left-color:#6b5a2a}
.strom .s-tuersteher_rueckmeldung{color:#f0a0a0;border-left-color:var(--rot)}
.strom .s-tuersteher.ok{color:#9ae6b4;border-left-color:var(--gruen)}
.strom .s-tuersteher.nein{color:#f0a0a0;border-left-color:var(--rot)}
.fuss{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--faint);border-top:1px solid var(--linie);padding-top:6px;white-space:nowrap;overflow:hidden}
.fuss>span{flex:none}
.fuss .kosten{color:var(--text);font-weight:600}
.fuss .gate{margin-left:auto}
.fuss .gate .ok{color:var(--gruen)} .fuss .gate .nein{color:var(--rot)}
.gate-banner{position:absolute;left:0;right:0;top:0;padding:6px 12px;font-size:12px;font-family:var(--mono);color:#0b0f16;transform:translateY(-100%);transition:transform .25s}
.gate-banner.zeigen{transform:none}
.gate-banner.ok{background:var(--gruen)} .gate-banner.nein{background:var(--rot);color:#fff}
.gate-banner small{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modus.warn{color:#0b0f16;background:var(--ocker)}
</style>
</head>
<body>
<header title="F = Vollbild · Klick auf eine Karte = groß/klein">
  <div class="thema"><b id="thema">Bühne</b><span id="lauf">–</span></div>
  <nav class="phasen" id="phasen"></nav>
  <div class="kennzahlen">
    <div class="kz"><b id="laufzeit">0:00</b><span>Laufzeit</span></div>
    <div class="kz"><b id="kosten">≈ 0,00 $</b><span>Kosten</span></div>
    <div class="kz"><b><span class="ok" id="g-ok">0</span> · <span class="nein" id="g-nein">0</span></b><span>Türsteher</span></div>
    <div class="kz"><b id="anzahl">0</b><span>Agenten</span></div>
    <div class="kz"><span class="modus" id="modus">…</span></div>
  </div>
</header>
<main id="raster"></main>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const raster=$("#raster");
const ZUSTAND={bereit:"bereit",denkt:"denkt nach",schreibt:"schreibt",werkzeug:"arbeitet",wartet_tuersteher:"wartet auf Türsteher",
  korrigiert:"korrigiert",untaetig:"untätig",fertig:"fertig",wartet:"wartet auf Start"};
const SYMBOL={text:"",denkt:"…",werkzeug:"›",ergebnis:"✓",nachricht:"✉",tuersteher_rueckmeldung:"⛔",tuersteher:"🛡"};
let snap=null, karten=new Map(), gross=null, quelle=null, laufzeitBasis=0, laufzeitStand=0, tickMs=0;

// ---------------------------------------------------------------- Formatierung
const fmtGeld=v=>"≈ "+(v||0).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" $";
const fmtTok=v=>v>=1e6?(v/1e6).toLocaleString("de-DE",{maximumFractionDigits:1})+"M":v>=1e4?Math.round(v/1e3)+"k":v>=1e3?(v/1e3).toLocaleString("de-DE",{maximumFractionDigits:1})+"k":String(v||0);
const fmtZeit=s=>{s=Math.max(0,Math.floor(s));const m=Math.floor(s/60),h=Math.floor(m/60);return h?`${h}:${String(m%60).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`:`${m}:${String(s%60).padStart(2,"0")}`};
const esc=t=>String(t??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const kurz=(t,n)=>{t=String(t??"").replace(/\s+/g," ").trim();return t.length>n?t.slice(0,n)+"…":t};
const rolleFarbe=r=>`var(--r-${r})`;
const hhmm=z=>{const d=new Date(z);return isNaN(d)?"":d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"})};

// ---------------------------------------------------------------- Kopfzeile
function zeigeLauf(l){
  $("#thema").textContent=l.lauf?.thema||"Bühne";
  $("#lauf").textContent=l.lauf?.ordner||"";
  $("#kosten").textContent=fmtGeld(l.kosten_usd);
  $("#g-ok").textContent=l.tuersteher?.akzeptiert??0; $("#g-nein").textContent=l.tuersteher?.abgelehnt??0;
  $("#anzahl").textContent=l.agenten_anzahl??karten.size;
  const m=$("#modus"); const modus=l.modus||"live";
  m.className="modus "+(modus==="live"?"live":modus==="replay"?"replay":"");
  m.textContent=modus==="live"?"LIVE":modus==="replay"?`REPLAY ×${l.replay_faktor||1}`:"REPLAY · ENDE";
  laufzeitBasis=l.laufzeit_s||0; laufzeitStand=Date.now(); tickMs=modus==="replay"?(l.replay_faktor||1):modus==="live"?1:0; zeigeLaufzeit();
  const ph=$("#phasen"); ph.innerHTML="";
  const idx=(l.phasen||[]).indexOf(l.phase);
  (l.phasen||[]).forEach((p,i)=>{const e=document.createElement("span");e.className="phase"+(i<idx?" done":i===idx?" aktiv":"");e.textContent=p;ph.appendChild(e)});
}
function zeigeLaufzeit(){$("#laufzeit").textContent=fmtZeit(laufzeitBasis+(Date.now()-laufzeitStand)/1000*tickMs)}
setInterval(zeigeLaufzeit,500);

// ---------------------------------------------------------------- Karten
function neueKarte(k){
  const el=document.createElement("article"); el.className="karte"; el.dataset.name=k.name;
  el.innerHTML=`<div class="gate-banner"></div>
    <div class="kopf"><span class="punkt"></span><span class="name"></span><span class="modell"></span>
      <span class="zustand"><span class="ring"></span><span class="z-text"></span></span></div>
    <div class="aufgabe"></div><div class="aktuell"></div><div class="strom"></div>
    <div class="fuss"><span class="tok"></span><span class="kosten"></span><span class="schritte"></span><span class="gate"></span></div>`;
  el.addEventListener("click",()=>{ if(el.classList.contains("platzhalter"))return; if(gross&&gross!==el)gross.classList.remove("gross"); el.classList.toggle("gross"); gross=el.classList.contains("gross")?el:null; scrollAlle(); });
  return el;
}
function zeigeKarte(k){
  let el=karten.get(k.name); if(!el){el=neueKarte(k);karten.set(k.name,el);sortiere();}
  el.style.setProperty("--farbe",rolleFarbe(k.rolle));
  el.querySelector(".punkt").style.background=rolleFarbe(k.rolle);
  el.querySelector(".name").textContent=k.name;
  el.querySelector(".modell").textContent=(k.modell_kurz&&k.modell_kurz!=="?")?k.modell_kurz+(k.preis_unbekannt?" · Preis unbekannt":""):"–";
  el.querySelector(".zustand").className="zustand z-"+k.zustand;
  el.querySelector(".z-text").textContent=ZUSTAND[k.zustand]||k.zustand;
  const a=el.querySelector(".aufgabe"); const m=/^\[([^\]]+)\]\s*(.*)$/.exec(k.aufgabe||"");
  a.innerHTML=m?`<b>${esc(m[2]||"")}</b> <span>${esc(m[1].split("/").slice(2).join("/"))}</span>`:esc(k.aufgabe||(k.rolle==="lead"?"koordiniert den Lauf":""));
  el.querySelector(".aktuell").textContent=k.aktuell||"";
  const t=k.tokens||{};
  el.querySelector(".tok").textContent=`out ${fmtTok(t.output)} · cache ${fmtTok(t.cache_lesen)}`;
  el.querySelector(".kosten").textContent=fmtGeld(k.kosten_usd);
  el.querySelector(".schritte").textContent=`${k.schritte||0} Schritte`;
  const g=k.tuersteher||{}; el.querySelector(".gate").innerHTML=(g.akzeptiert||g.abgelehnt)?`🛡 <span class="ok">${g.akzeptiert||0}</span> · <span class="nein">${g.abgelehnt||0}</span>`:"";
  if(k.strom){const s=el.querySelector(".strom");s.innerHTML="";k.strom.forEach(ev=>s.appendChild(zeile(ev)));s.scrollTop=s.scrollHeight;}
}
function zeile(ev){
  const d=document.createElement("div"); let cls="s-"+ev.art, txt="";
  switch(ev.art){
    case "text": txt=kurz(ev.text,320); break;
    case "denkt": txt="denkt nach"; break;
    case "werkzeug": txt=ev.titel+(ev.detail&&ev.werkzeug==="Bash"?"\n  $ "+kurz(ev.detail,140):""); break;
    case "ergebnis": txt=(ev.fehler?"✗ ":"✓ ")+kurz(ev.auszug||"",140); cls+=ev.fehler?" fehler":""; break;
    case "nachricht": txt="✉ "+(ev.von?ev.von+": ":"")+kurz(ev.text,200); break;
    case "tuersteher_rueckmeldung": txt="⛔ "+kurz(ev.text,220); break;
    case "tuersteher": { const ok=ev.entscheidung==="akzeptiert"; cls+=ok?" ok":" nein";
      txt=`🛡 Türsteher ${ok?"akzeptiert":"lehnt ab"}: ${(ev.datei||"").split("/").slice(2).join("/")}`+(ev.fehler&&ev.fehler.length?"\n  – "+ev.fehler.slice(0,3).map(f=>kurz(f,90)).join("\n  – "):""); break; }
    default: txt=JSON.stringify(ev);
  }
  d.className=cls; d.textContent=txt; d.title=hhmm(ev.zeit);
  return d;
}
function anhaengen(ev){
  const el=karten.get(ev.agent); if(!el)return;
  const s=el.querySelector(".strom"); s.appendChild(zeile(ev));
  while(s.children.length>40)s.removeChild(s.firstChild);
  s.scrollTop=s.scrollHeight;
  if(ev.art==="tuersteher")blitz(el,ev);
}
function blitz(el,ev){
  const ok=ev.entscheidung==="akzeptiert"; const b=el.querySelector(".gate-banner");
  b.className="gate-banner zeigen "+(ok?"ok":"nein");
  b.innerHTML=`<b>${ok?"✓ Türsteher: akzeptiert":"✗ Türsteher: abgelehnt"}</b> <small>${esc((ev.datei||"").split("/").slice(2).join("/"))}${ev.grund?" · "+esc(ev.grund):""}${ev.fehler&&ev.fehler.length?" · "+esc(ev.fehler.slice(0,3).join(" · ")):""}</small>`;
  el.classList.remove("blitz-ok","blitz-nein"); el.classList.add(ok?"blitz-ok":"blitz-nein");
  clearTimeout(el._blitz); el._blitz=setTimeout(()=>{el.classList.remove("blitz-ok","blitz-nein");b.classList.remove("zeigen")},ok?1500:4000);
}
function scrollAlle(){karten.forEach(el=>{const s=el.querySelector(".strom");s.scrollTop=s.scrollHeight})}

// Reihenfolge wie im Server: Lead, dann Rollen in Pipeline-Reihenfolge, innerhalb der Rolle nach Startzeit.
const ROLLEN=["lead","markt","treiber","kette","firma","red-team","lektor","sonstige"];
function sortiere(){
  const namen=[...karten.keys()].sort((a,b)=>{
    const ka=(snap&&snap.agenten[a])||{}, kb=(snap&&snap.agenten[b])||{};
    const ra=ROLLEN.indexOf(ka.rolle||rolleAusName(a)), rb=ROLLEN.indexOf(kb.rolle||rolleAusName(b));
    if(ra!==rb)return ra-rb;
    const ta=Date.parse(ka.gestartet||"")||0, tb=Date.parse(kb.gestartet||"")||0;
    return (ta-tb)||a.localeCompare(b);
  });
  namen.forEach(n=>raster.appendChild(karten.get(n)));
  platzhalter();
}
function platzhalter(){
  raster.querySelectorAll(".platzhalter").forEach(e=>e.remove());
  if(!snap||!snap.erwartet||snap.modus==="replay-ende")return;
  const zaehl={}; karten.forEach((el,n)=>{const r=(snap.agenten[n]||{}).rolle||rolleAusName(n);zaehl[r]=(zaehl[r]||0)+1});
  snap.erwartet.forEach(r=>{ if(zaehl[r]>0){zaehl[r]--;return;}
    const el=neueKarte({name:r}); el.classList.add("platzhalter");
    el.querySelector(".punkt").style.background=rolleFarbe(r); el.querySelector(".name").textContent=r;
    el.querySelector(".modell").textContent="–"; el.querySelector(".zustand").className="zustand z-wartet";
    el.querySelector(".z-text").textContent=ZUSTAND.wartet; raster.appendChild(el); });
}
function rolleAusName(n){for(const r of ["red-team","markt","treiber","kette","firma","lektor"])if(n===r||n.startsWith(r+"-"))return r;return n==="lead"?"lead":"sonstige"}

// ---------------------------------------------------------------- Daten
function init(s){
  snap=s; karten.forEach(el=>el.remove()); karten.clear(); gross=null;
  zeigeLauf(s);
  (s.reihenfolge||Object.keys(s.agenten||{})).forEach(n=>zeigeKarte(s.agenten[n]));
  sortiere(); scrollAlle();
}
function verbinde(){
  if(quelle)quelle.close();
  quelle=new EventSource("/api/events");
  quelle.addEventListener("init",e=>init(JSON.parse(e.data)));
  quelle.addEventListener("karte",e=>{const k=JSON.parse(e.data);const neu=!karten.has(k.name);if(snap)snap.agenten[k.name]=Object.assign(snap.agenten[k.name]||{},k);zeigeKarte(k);if(neu)sortiere();});
  quelle.addEventListener("ereignis",e=>anhaengen(JSON.parse(e.data)));
  quelle.addEventListener("lauf",e=>{const l=JSON.parse(e.data);if(snap)Object.assign(snap,l);zeigeLauf(l);if(l.modus==="replay-ende")platzhalter();});
  quelle.onerror=()=>{const m=$("#modus");m.className="modus warn";m.textContent="VERBINDE NEU …";
    quelle.close(); setTimeout(()=>fetch("/api/state").then(r=>r.json()).then(s=>{init(s);verbinde();}).catch(verbinde),1500)};
}
document.addEventListener("keydown",e=>{ if(e.key==="f"||e.key==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();} });
// ?standbild=1: nur der Snapshot, kein Ereignisstrom (für Screenshots und Standbilder)
if(new URLSearchParams(location.search).has("standbild")){
  fetch("/api/state").then(r=>r.json()).then(init);
}else{
  verbinde();
}
})();
</script>
</body>
</html>
